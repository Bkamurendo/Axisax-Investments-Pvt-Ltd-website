# Netlify: builds on Netlify's servers (no GitHub Actions needed).
# The site URL defaults to https://axisaxinvestments.netlify.app/ (src/data/site.js).
# When a custom domain is added, set SITE_URL under Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
